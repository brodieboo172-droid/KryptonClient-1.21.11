name: Build Krypton Client

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2'

      - name: Extract project
        run: |
          mkdir project
          unzip -q "$(find . -maxdepth 1 -name '*.zip' | head -n 1)" -d project

      - name: Find project folder
        run: |
          echo "PROJECT_DIR=$(find project -mindepth 1 -maxdepth 1 -type d | head -n 1)" >> "$GITHUB_ENV"

      - name: Build mod
        run: |
          cd "$PROJECT_DIR"
          gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: KryptonClient-1.21.11
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
