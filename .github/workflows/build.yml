name: Build Krypton Client

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Extract Krypton project
        shell: bash
        run: |
          mkdir extracted
          unzip -q KryptonClient-1.21.11-port.zip -d extracted
          echo "PROJECT=extracted/KryptonClient-1.21.11" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: |
          cd "$PROJECT"
          gradle build --no-daemon --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: KryptonClient-1.21.11
          path: extracted/KryptonClient-1.21.11/build/libs/*.jar
